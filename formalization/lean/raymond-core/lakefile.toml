name = "RaymondCore"
version = "0.1.0"
defaultTargets = ["RaymondCore"]

[leanOptions]
autoImplicit = false

# Same Mathlib commit as the openai/math build (Lean 4.34.1).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# LeanCert: provides the de Bruijn-Newman heat integral H_t, the identity
# H_0(z) = xi(1/2 + i z/2)/8 and de Bruijn's squared-strip contraction.
[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert.git"
rev = "7f91b6eb3567437f6cfac03ed279706603ee22f4"

[[lean_lib]]
name = "RaymondCore"
