[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigorous-shear-gram"
version = "0.1.0"
description = "Finite Xi-shear de Branges Gram certification with Arb/ACB balls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "ISC"}
authors = [{name = "Jude Gomila"}]
dependencies = ["python-flint==0.9.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: ISC License (ISCL)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
shear-gram = "rigorous.shear_gram.cli:main"

[tool.setuptools]
packages = ["rigorous.shear_gram"]
package-dir = {"rigorous.shear_gram" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
