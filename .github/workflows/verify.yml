name: verify

# COST CONTROL (2026-07): the autonomous engine fleet pushes hundreds of commits/day
# directly to main. Running this job on every push was the source of the metered
# GitHub Actions bill (npm ci + build + heavy assertion sweep, ~several min each,
# hundreds of times a day). Triggers are now restricted to actual pull requests and
# manual dispatch, so the fleet's direct main pushes cost ZERO Actions minutes.
# Safety is still covered elsewhere: Vercel's own deploy build fails on broken commits,
# each engine runs `npm run build` per ticket, and scripts/prepush-tracked-imports-guard.mjs
# catches the shared-worktree import race. To verify main on demand: Actions tab -> verify
# -> "Run workflow" (workflow_dispatch), or re-add `push: { branches: [main] }` below.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded in-flight runs (e.g. rapid PR pushes) so only the latest is billed.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep checkout bounded; this repository's full history is large.
          fetch-depth: 50

      - name: Verify conditional Mobius parameter certificate
        working-directory: rigorous/mobius_bridge_reduction
        run: |
          sha256sum --check SHA256SUMS.txt
          python3 -E verify_certificate.py
          python3 -E certify_parameters.py
          git diff --exit-code -- parameter_certificate.json target_obstruction.json
          python3 -E target_0874.py
          python3 -E target_0874.py --json > /tmp/target_0874_certificate.json
          diff -u target_0874_certificate.json /tmp/target_0874_certificate.json
          python3 -E signed_phase_filter.py
          python3 -E signed_phase_filter.py --json > /tmp/signed_phase_filter_results.json
          diff -u signed_phase_filter_results.json /tmp/signed_phase_filter_results.json

      - name: Fetch bounded PR base for assertion diff
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=50 origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check zeta riblet and phase-budget research checkpoint
        run: node research-checkpoints/zeta-riblet-phase-budget-2026-11-02/verify.mjs

      - name: Build
        run: npm run build

      - name: Assert bounded changed modules + headline reproduction + smoke
        if: github.event_name == 'pull_request'
        run: npm run assert:pr

      - name: Assert full historical sweep (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm run assert

      - name: Heavy-import tripwire (pages must not import zeros-to-1e6.js)
        run: npm run verify:heavy-imports

