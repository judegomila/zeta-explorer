# Install once per clone: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: commit-hygiene
        name: commit hygiene (paths, home directories, transcripts)
        entry: scripts/check-commit-hygiene.sh
        language: script
        pass_filenames: false
        always_run: true
