name: Hidden-square status regressions
on:
  pull_request:
    paths:
      - 'src/data/hidden-square-program-section.js'
      - 'src/pages/HiddenSquareProgramPage.jsx'
      - 'scripts/test-hidden-square-status.mjs'
      - '.github/workflows/hidden-square-status.yml'
  push:
    branches: ['repair/hidden-square-status-20261101']
    paths:
      - 'src/data/hidden-square-program-section.js'
      - 'src/pages/HiddenSquareProgramPage.jsx'
      - 'scripts/test-hidden-square-status.mjs'
      - '.github/workflows/hidden-square-status.yml'
permissions:
  contents: read
jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/test-hidden-square-status.mjs
