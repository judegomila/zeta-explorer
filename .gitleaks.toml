# gitleaks configuration. Extends the default rule set.
[extend]
useDefault = true

# Numeric tables and content hashes in generated research files trip the
# generic high-entropy rule. Only that rule is switched off for those paths:
# every provider-specific rule (cloud keys, tokens, private keys and so on)
# still runs on every file in the repository.
[[allowlists]]
description = "Generated numeric data: generic entropy rule only"
targetRules = ["generic-api-key"]
paths = [
  '''src/data/.*\.(js|json)$''',
  '''src/pages/Imp[0-9A-Za-z]+Viz\.jsx$''',
  '''research-checkpoints/.*\.(json|txt|log|out)$''',
  '''package-lock\.json$''',
  # research notes and labelled content hashes
  '''research-checkpoints/.*\.jsonl$''',
  '''research-inputs/.*\.json$''',
]

# The documented placeholder in scripts/.env.example, in that file only.
[[allowlists]]
description = "Placeholder key in the example environment file"
condition = "AND"
paths = ['''^scripts/\.env\.example$''']
regexes = ['''sk-ant-api03-[A-Z_-]+$''']
